# .devcontainer/docker-compose.yml
version: '3.8'

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
    command: sleep infinity
    networks:
      - topgun-dev

volumes:
  node_modules:

networks:
  topgun-dev:
    driver: bridge
