name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'deploy/Dockerfile.server'
      - 'packages/core-rust/**'
      - 'packages/server-rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/check-redb-vendor.sh'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/Dockerfile.server'
      - 'packages/core-rust/**'
      - 'packages/server-rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/check-redb-vendor.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:  # allow manual runs

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  # Cancel queued PR builds when a newer push to the same PR ref arrives (saves CI minutes during PR iteration);
  # NEVER cancel in-progress publishes on main / tag refs — they may have already pushed partial tags to GHCR
  # and a mid-flight cancel would leave the registry in an inconsistent state.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # One job per architecture, each on a native runner: the image compiles
    # RocksDB's C++, which under QEMU emulation of arm64 on an amd64 runner is
    # many times slower and outlasts the job timeout. Every PR builds and
    # smoke-tests both images; a release tag also pushes each by digest, and
    # the merge job below publishes them as one multi-arch tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build smoke-test image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: topgun-server:smoke
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Run smoke test
        run: |
          docker run -d --name topgun-smoke -p 8080:8080 -e TOPGUN_NO_AUTH=1 topgun-server:smoke
          echo "Waiting for /health to return 200..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30 seconds"
          exit 1

      - name: Capture smoke-test logs
        if: always()
        run: docker logs topgun-smoke || true

      - name: Stop and remove smoke-test container
        if: always()
        run: docker rm -f topgun-smoke || true

      - name: Push image by digest
        # Release tags only: the images are consumed there. The layers come
        # from the cache the smoke build just filled.
        if: startsWith(github.ref, 'refs/tags/')
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/topgunbuild/topgun-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # One multi-arch tag over the per-architecture digests.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/topgunbuild/topgun-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("ghcr.io/topgunbuild/topgun-server@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect the published image
        run: docker buildx imagetools inspect ghcr.io/topgunbuild/topgun-server:${{ steps.meta.outputs.version }}
