name: Integration (Rust server ↔ TS client)

# Live cross-boundary integration: real Rust server + real TS client over a
# WebSocket. This is the only gate that exercises sync / reconnect / offline-queue
# / optimistic-restamp / live-query apply end-to-end — the durability and
# convergence promises that unit tests (mocked transport) and Rust-only tests
# (no client) both miss. A silent group-by wire-format regression reached main
# precisely because this suite was not gated; this workflow closes that hole.

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/server-rust/**'
      - 'packages/core-rust/**'
      - 'packages/mcp-server/**'
      - 'tests/integration-rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pnpm-lock.yaml'
      - 'scripts/check-server-binary-size.sh'
      - '.github/workflows/integration-rust.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/server-rust/**'
      - 'packages/core-rust/**'
      - 'packages/mcp-server/**'
      - 'tests/integration-rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pnpm-lock.yaml'
      - 'scripts/check-server-binary-size.sh'
      - '.github/workflows/integration-rust.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the server binary once and hand it to both test jobs as an artifact, so
  # the ~release-build cost is paid a single time rather than duplicated per job.
  build-server:
    name: Build server binary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rustup ships preinstalled on ubuntu-latest; `rustup show` honors the
        # pinned channel in rust-toolchain.toml (same pattern as rust.yml).
        run: rustup show

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-
            ${{ runner.os }}-cargo-

      - name: Build topgun-server (release)
        run: cargo build --release --bin topgun-server

      - name: Check server binary size
        # Native linux-x64 build with the release profile, the same profile the
        # published binary uses. The ceiling lives in the script, not here.
        # Non-blocking for now: the runner's native link comes out about 230 KB
        # larger than the cargo-zigbuild link of the published binary, which puts
        # it over the 20 MiB ceiling while the published binary is under it. The
        # ceiling is to be raised together with the RocksDB engine; make the step
        # blocking then. Until then the printed size still shows growth per PR.
        continue-on-error: true
        run: bash scripts/check-server-binary-size.sh target/release/topgun-server linux-x64

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: topgun-server-release
          path: target/release/topgun-server
          retention-days: 1
          if-no-files-found: error

  # BLOCKING gate. Single-server cross-boundary suites — sync, reconnect, offline,
  # optimistic restamp, live-query apply, CRDT merge, RBAC, search, merkle delta.
  # These are deterministic; verified green across repeated --runInBand runs.
  integration:
    name: Integration tests (blocking)
    needs: [build-server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: topgun-server-release
          path: target/release

      - name: Make server binary executable
        run: chmod +x target/release/topgun-server

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run integration tests (single-server suites)
        # ts-jest compiles @topgunbuild/{core,client,mcp-server} from source via the
        # config's moduleNameMapper, so no package build is needed (the MCP harness
        # drives the workspace source, not a stale published dist). RUST_SERVER_BINARY points
        # spawnRustServer() at the prebuilt binary (skips cargo). --runInBand keeps
        # per-file fixtures from contending on the fixed server ports (CLAUDE.md).
        # This is the same script a developer runs locally. What it leaves out,
        # and why, is listed in one place — tests/integration-rust/opt-in-suites.js —
        # and printed at the start of the run:
        # - map-name-upgrade, map-name-rollback and watermark-rollback each drive
        #   two server binaries, the current one and an older one (built from
        #   07d009f0, b346e277 and 6a030bb6 respectively), and CI does not build
        #   the older ones. Rollback across each boundary is a one-time
        #   property, not a regression surface, so the three files are run locally
        #   (`pnpm test:integration-rust:two-binary`) and their output is carried
        #   in the pull request.
        # - store-refusal-liveness, flush-task-panic and store-broken each need a
        #   server built with the `fault-injection` cargo feature, and this job
        #   builds one binary without it. All three are run locally
        #   (`pnpm test:integration-rust:liveness`). What guards the three defects
        #   in CI is the in-process tests in `cargo test` and the clippy gate.
        # - write-behind-batch-measure times the write-behind drain and the start
        #   replay of a 6a030bb6 build against this binary, out of process, for up
        #   to three hours on one machine; CI builds neither the 6a030bb6 binary nor
        #   offers a quiet machine, so it is run locally
        #   (`pnpm test:integration-rust:measure`) and its JSON is carried in the
        #   pull request.
        # - cluster-routing is left out by the variable below and gated separately
        #   (non-blocking) in the next job.
        # Each of these files fails, never skips, when what it needs is not given.
        env:
          RUST_SERVER_BINARY: ${{ github.workspace }}/target/release/topgun-server
          INTEGRATION_RUST_SKIP_CLUSTER_ROUTING: '1'
        run: pnpm test:integration-rust --runInBand

  # NON-BLOCKING. The 3-node cluster suite intermittently fails to converge
  # (one node sometimes never joins → nodeCount stuck at 2) even from a cold
  # start — a pre-existing race in the parallel-boot formation protocol, not a
  # product-path regression (the server is single-node-stable today; clustering
  # is experimental). Gating PRs on a ~30%-flaky suite would redden merges at
  # random, so it runs for signal only until the join race is fixed.
  # Tracked: TODO-504 (cluster-formation join race — un-gate once deterministic).
  cluster-routing:
    name: Cluster routing tests (non-blocking)
    needs: [build-server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: topgun-server-release
          path: target/release

      - name: Make server binary executable
        run: chmod +x target/release/topgun-server

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run cluster-routing suite
        env:
          RUST_SERVER_BINARY: ${{ github.workspace }}/target/release/topgun-server
        run: pnpm test:integration-rust --runInBand cluster-routing
