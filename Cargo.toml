[workspace]
resolver = "2"
members = [
    "packages/core-rust",
    "packages/server-rust",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/topgunbuild/topgun"

[workspace.lints.clippy]
# The groups sit one priority below the individual entries, so an entry that names
# a single lint (the two `deny` lines below) overrides the group it belongs to.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Adopted per project lint-strictness policy; rationale in CONTRIBUTING.md
# § Lint strictness policy (clippy). All three guard against unfinished /
# debug-leftover code reaching production paths; zero existing fires in
# production code at adoption time.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Denied explicitly, so the rule depends neither on group membership nor on
# `-D warnings`: a lock guard alive across an `.await` can block a runtime worker
# thread, and one blocked worker can stop the whole server. The guard types
# `await_holding_invalid_type` looks for are listed in the root `clippy.toml`.
# Rationale and measured limits in CONTRIBUTING.md § Lint strictness policy.
await_holding_lock = "deny"
await_holding_invalid_type = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
madsim = "0.2.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
# opt-level defaults to 3 for release — kept explicit-by-omission to protect
# the load-harness perf gates (p99 < 500 ms, ops/sec baselines). Do NOT switch
# the profile as a whole to opt-level "z"/"s" or to panic = "abort".

# Size-optimized code for crates that never run on the request path, so the
# prebuilt binary stays under the size gate in scripts/build-server-binaries.sh
# without touching the hot path: command-line parsing (clap), the OpenAPI document
# (utoipa), the outbound HTTP client of the embedding providers and the JWKS fetch
# (reqwest), certificate and PEM handling (rustls-webpki, rustls-pemfile), URL and
# IDNA parsing with its Unicode tables (url, idna, icu_*, zerovec and friends).
# hyper-util, rustls and tower-http are deliberately absent: the server's own
# connections run through them. So is regex-syntax: LIKE and REGEX predicates
# compile their pattern on every evaluation, i.e. per record while a query or
# subscription runs. An entry that no longer matches a dependency only makes cargo
# warn, so prune the list when a crate leaves the tree.
[profile.release.package]
clap = { opt-level = "s" }
clap_builder = { opt-level = "s" }
clap_lex = { opt-level = "s" }
utoipa = { opt-level = "s" }
utoipa-axum = { opt-level = "s" }
reqwest = { opt-level = "s" }
url = { opt-level = "s" }
idna = { opt-level = "s" }
idna_adapter = { opt-level = "s" }
icu_collections = { opt-level = "s" }
icu_locale_core = { opt-level = "s" }
icu_normalizer = { opt-level = "s" }
icu_properties = { opt-level = "s" }
icu_provider = { opt-level = "s" }
iri-string = { opt-level = "s" }
rustls-webpki = { opt-level = "s" }
rustls-pemfile = { opt-level = "s" }
litemap = { opt-level = "s" }
zerovec = { opt-level = "s" }
yoke = { opt-level = "s" }
tinystr = { opt-level = "s" }
writeable = { opt-level = "s" }
potential_utf = { opt-level = "s" }

[profile.release-with-debug]
inherits = "release"
debug = true
# Inherit release LTO/codegen settings but keep debug symbols for flamegraph
# profiling; strip = false ensures debug info is not stripped away.
strip = false

# Faster builds for simulation runs: opt-level=1 reduces compile time vs release
# while still being fast enough for large test suites. debug-assertions=true
# catches invariant violations that release mode would silently skip.
[profile.ci-sim]
inherits = "dev"
opt-level = 1
debug-assertions = true
