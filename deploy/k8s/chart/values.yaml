# There is no cluster mode in this chart: every pod has its own store on its
# own volume and does not share data with the others. Keep this at 1.
replicaCount: 1

# Persistent storage for the embedded store and the write-ahead log. Both
# live under mountPath (the store directory topgun-data and topgun-wal);
# topgun.redb there is the store file of earlier versions, which the server
# migrates into topgun-data once and then replaces by a small marker file.
# That migration needs 1.5 x the size of topgun.redb plus 64 MiB free on the
# volume. A topgun-data written by an earlier version holds engine.redb,
# which the server migrates once into engine.rocksdb/ and keeps as
# engine.redb.pre-rocksdb; that migration needs 1.5 x the size of
# engine.redb plus 64 MiB free, and the volume then holds both stores until
# the kept file is deleted. Without persistence the data is lost when the
# pod is rescheduled.
persistence:
  enabled: true
  size: 1Gi
  # Empty uses the cluster's default storage class.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  mountPath: /data

image:
  # Override per environment if you're hosting the image elsewhere.
  repository: ghcr.io/topgunbuild/topgun-server
  pullPolicy: IfNotPresent
  # Pin to a concrete tag (e.g. "2.0.0") for reproducible deploys; "latest"
  # is convenient for dev but follows whatever main pushes.
  tag: "2.0.0"

service:
  type: ClusterIP
  port: 8080

cluster:
  port: 9080
  # Discovery mode: 'manual' or 'kubernetes'
  discovery: kubernetes
  # DNS discovery interval in ms
  discoveryInterval: 10000

# Phase 4: Cluster Configuration
clustering:
  # Enable gradual partition rebalancing (recommended for production)
  gradualRebalancing: true
  # Enable async replication pipeline
  replicationEnabled: true

  # Migration configuration
  migration:
    # Partitions per batch during migration
    batchSize: 10
    # Delay between migration batches in ms
    batchIntervalMs: 5000
    # Bytes per migration chunk
    transferChunkSize: 65536
    # Max retries per partition migration
    maxRetries: 3
    # Concurrent partition transfers
    parallelTransfers: 4

  # Replication configuration
  replication:
    # Default consistency: EVENTUAL, QUORUM, or STRONG
    defaultConsistency: EVENTUAL
    # Max queued replication operations
    queueSizeLimit: 10000
    # Operations per replication batch
    batchSize: 100
    # Batch flush interval in ms
    batchIntervalMs: 50
    # Ack timeout in ms
    ackTimeoutMs: 5000

# Health probes
probes:
  # The store open runs before the server listens, and it includes the
  # one-time migrations of a store written by an earlier version, so no probe
  # answers until it is done. Measured on a Mac: 1 000 000 rows of 1 KiB
  # migrated from engine.redb in 6.56 s; the older table-per-map file took
  # about 16 s per GiB. The budget here, failureThreshold x periodSeconds =
  # 30 minutes, leaves room for far larger stores and slower disks; liveness
  # and readiness start only once this probe has passed. Raise it for a store
  # of many GiB on slow storage.
  startup:
    enabled: true
    path: /health/live
    periodSeconds: 10
    failureThreshold: 180
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5

# Metrics
metrics:
  enabled: true
  port: 9090

# The server's defaults use up to TOPGUN_MAX_RAM_MB (1024 MiB, the record
# cache) plus TOPGUN_ENGINE_CACHE_MB (256 MiB, RocksDB) = 1280 MiB, and the
# rest of the process comes on top. Raise the limit when you raise either.
resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Pod Disruption Budget
# Enable only with replicaCount of 2 or more, and keep minAvailable below
# replicaCount: otherwise no voluntary eviction is allowed and a node drain
# never finishes.
podDisruptionBudget:
  enabled: false
  minAvailable: 2

# TLS Configuration
tls:
  enabled: false
  # secretName: topgun-tls
  # certPath: /certs/tls.crt
  # keyPath: /certs/tls.key

env: {}
  # RUST_LOG: "topgun_server=info"
